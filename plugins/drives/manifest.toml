# ostrov's removable drives, as GNOME has them: USB sticks, SD cards, external disks and phones' mass storage found
# by lsblk as udev says a block device came or went, mounted, unmounted and powered off through udisksctl
id = "drives"
name = "Drives"
version = "0.1.0"
api = 1
exec = "ostrov-plugin-drives"
icon = "drive-removable-media-symbolic"
description = "Removable drives: mounted, opened and ejected through udisks."
permissions = ["run"]

[[widgets]]
id = "drives"
name = "Drives"
sizes = [[4, 1], [2, 1]]
badge = true
bar = "active"

[[commands]]
name = "list"
help = "the removable drives and their volumes, as JSON"

[[commands]]
name = "mount"
usage = "mount NAME"
help = "a drive's volumes mounted, or one volume (sdb, sdb1 or a label)"

[[commands]]
name = "unmount"
usage = "unmount NAME"
help = "a drive's volumes unmounted, or one volume"

[[commands]]
name = "eject"
usage = "eject NAME"
help = "a drive's volumes unmounted and the drive powered off, safe to pull out"

[[commands]]
name = "open"
usage = "open NAME"
help = "a drive's volume opened in the file manager, mounted first if it is not"
