[package]
name = "ostrov-plugin-night"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "ostrov's night light: warmer colours through Hyprland's screen shader, on, by the clock or the sun"
license = "MIT"
publish = false

[dependencies]
ostrov-plugin = { path = "../../sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2"
