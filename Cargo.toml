[package]
name = "rbar"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
glib-unix = "0.22"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
serde_json = "1.0.151"
system-tray = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
