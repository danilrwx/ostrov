[package]
name = "ostrov"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
description = "A whole desktop shell for Hyprland in one binary: bar, panels, launcher, notifications, lock screen and more"
license = "MIT"
repository = "https://github.com/danilrwx/ostrov"
readme = "README.md"
keywords = ["hyprland", "wayland", "desktop", "shell", "gtk4"]
categories = ["gui"]
exclude = ["/.github", "/packaging/arch", "/flake.nix"]

# ostrov itself at the root, built alone by `cargo build`; the Rust SDK for plugins and the official plugins beside
# it, built with it by `cargo build --workspace` (plugins/README.md), one target directory for all.
[workspace]
members = ["sdk", "plugins/*"]

[dependencies]
async-channel = "2.5.0"
futures-util = "0.3.34"
gdk4-wayland = { version = "0.11.5", features = ["wayland_crate"] }
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = "0.22"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
gtk4-session-lock = { version = "0.4.1", features = ["v1_2"] }
kdl = { version = "6.5.0", features = ["v1-fallback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
system-tray = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "sync", "net"] }
toml = "1.1"
toml_edit = "0.25"
ureq = "3"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }


# the binaries without their symbols: the packages a half of what they were
[profile.release]
strip = true
