# ostrov's colours for tmux: its status line, borders and messages, the grounds the terminal's
set -g status-style "bg=default,fg={{dim}}"
set -g window-status-style "fg={{dim}}"
set -g window-status-current-style "fg={{accent}},bold"
set -g pane-border-style "fg={{card}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg={{accent}},fg={{ink}}"
set -g mode-style "bg={{accent}},fg={{ink}}"
set -g display-panes-active-colour "{{accent}}"
set -g display-panes-colour "{{dim}}"
set -g clock-mode-colour "{{accent}}"
