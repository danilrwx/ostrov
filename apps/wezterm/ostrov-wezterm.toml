# ostrov's colours for WezTerm, its ground the bar's: config.color_scheme = "ostrov",
# config.window_background_opacity = {{bar_alpha}} for its see-through
[metadata]
name = "ostrov"

[colors]
foreground = "{{fg}}"
background = "{{bar}}"
cursor_bg = "{{accent}}"
cursor_fg = "{{ink}}"
cursor_border = "{{accent}}"
selection_bg = "{{accent}}"
selection_fg = "{{ink}}"
split = "{{dim}}"
ansi = ["{{ansi0}}", "{{ansi1}}", "{{ansi2}}", "{{ansi3}}", "{{ansi4}}", "{{ansi5}}", "{{ansi6}}", "{{ansi7}}"]
brights = ["{{ansi8}}", "{{ansi9}}", "{{ansi10}}", "{{ansi11}}", "{{ansi12}}", "{{ansi13}}", "{{ansi14}}", "{{ansi15}}"]

[colors.tab_bar]
background = "{{bar}}"
[colors.tab_bar.active_tab]
bg_color = "{{accent}}"
fg_color = "{{ink}}"
[colors.tab_bar.inactive_tab]
bg_color = "{{card}}"
fg_color = "{{dim}}"
