# ostrov's colours, its ground the bar's, as solid: [main] include=~/.local/state/ostrov/colors/foot.ini
# both its themes the same colours, the one it starts on the mode's: foot tells programs asking (tmux, Claude Code)
# the first is dark, the second light, and as ostrov signals it over from one to the other
initial-color-theme={{mode_n}}

[colors]
alpha={{bar_alpha|bare}}
# every cell see-through, its own ground too: floats, selections, diffs
alpha-mode=all
background={{bar|bare}}
foreground={{fg|bare}}
selection-background={{accent|bare}}
selection-foreground={{ink|bare}}
cursor={{bar|bare}} {{fg|bare}}
regular0={{ansi0|bare}}
regular1={{ansi1|bare}}
regular2={{ansi2|bare}}
regular3={{ansi3|bare}}
regular4={{ansi4|bare}}
regular5={{ansi5|bare}}
regular6={{ansi6|bare}}
regular7={{ansi7|bare}}
bright0={{ansi8|bare}}
bright1={{ansi9|bare}}
bright2={{ansi10|bare}}
bright3={{ansi11|bare}}
bright4={{ansi12|bare}}
bright5={{ansi13|bare}}
bright6={{ansi14|bare}}
bright7={{ansi15|bare}}

