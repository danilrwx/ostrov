# ostrov's colours, its ground the bar's, as solid: import = ["~/.local/state/ostrov/colors/alacritty.toml"]
[window]
opacity = {{bar_alpha}}
[colors.primary]
background = "{{bar}}"
foreground = "{{fg}}"
[colors.cursor]
cursor = "{{fg}}"
text = "{{bar}}"
[colors.selection]
background = "{{accent}}"
text = "{{ink}}"
[colors.normal]
black = "{{ansi0}}"
red = "{{ansi1}}"
green = "{{ansi2}}"
yellow = "{{ansi3}}"
blue = "{{ansi4}}"
magenta = "{{ansi5}}"
cyan = "{{ansi6}}"
white = "{{ansi7}}"
[colors.bright]
black = "{{ansi8}}"
red = "{{ansi9}}"
green = "{{ansi10}}"
yellow = "{{ansi11}}"
blue = "{{ansi12}}"
magenta = "{{ansi13}}"
cyan = "{{ansi14}}"
white = "{{ansi15}}"
