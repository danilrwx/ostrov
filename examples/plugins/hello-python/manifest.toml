# ostrov's example plugin: a toggle counting its clicks, its menu adding and resetting and showing the window
# focused, its settings a greeting and a token kept in the keyring; Super+F12 flips it
id = "hello-python"
name = "Hello"
version = "0.1.0"
api = 1
exec = "python3 main.py"
icon = "face-smile-symbolic"
description = "Counts its clicks; the SDK's example."
permissions = ["secrets", "dialogs", "events", "keys"]
events = ["window"]            # ostrov's events it follows: on_shell_event("window", {"class", "title"})

[[keys]]
combo = "SUPER, F12"           # bound where free, to `ostrov plugin hello-python toggle`
command = "toggle"

[[widgets]]
id = "counter"
name = "Hello Counter"
icon = "face-smile-symbolic"
sizes = [[4, 1], [2, 1], [8, 1]]
badge = true                   # its count in the bar, render("counter#bar")
bar = "active"                 # while the toggle is on, unless the panel says otherwise

[[commands]]
name = "count"
help = "the count now"

[[commands]]
name = "set"
usage = "set N"
help = "the count set to N"

[[commands]]
name = "toggle"
help = "the toggle flipped"

[[commands]]
name = "reset"
help = "the count back to 0"

[[commands]]
name = "rename"
help = "a dialog asking the toggle's new title"

[[commands]]
name = "note"
usage = "note < TEXT"
help = "what is piped in shown in its menu"
