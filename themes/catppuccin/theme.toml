# Catppuccin (https://catppuccin.com/palette): Mocha after dark, Latte by day ([light]).
name = "Catppuccin"
author = "ostrov"
version = "1"
# suggestions, taken while [appearance] says nothing of them
radius = 12
density = "normal"

[colors]
surface = "#1e1e2e"                      # base
bar = "rgba(17, 17, 27, ALPHA)"          # crust, as see-through as the wallpaper's bar setting says
fg = "#cdd6f4"                           # text
dim = "#a6adc8"                          # subtext0
ink = "#1e1e2e"                          # base on the accent
accent = "#cba6f7"                       # mauve
accent-rule = "#9d7cd8"
accent-pressed = "#b491e8"
hover = "rgba(205, 214, 244, 0.12)"
raised = "rgba(205, 214, 244, 0.07)"
card = "rgba(205, 214, 244, 0.05)"
well = "#313244"                         # surface0
sunk = "rgba(17, 17, 27, 0.5)"
rule = "#45475a"                         # surface1
idle = "#6c7086"                         # overlay0
handle = "#89b4fa"                       # blue
urgent = "#f38ba8"                       # red
recording = "#f38ba8"
lock = "#11111b"
ground = "#11111b"

# Latte
[light]
surface = "#eff1f5"                      # base
bar = "rgba(220, 224, 232, ALPHA)"       # crust
fg = "#4c4f69"                           # text
dim = "#6c6f85"                          # subtext0
ink = "#eff1f5"
accent = "#8839ef"                       # mauve
accent-rule = "#7028d4"
accent-pressed = "#7a2fe0"
hover = "rgba(76, 79, 105, 0.08)"
raised = "rgba(76, 79, 105, 0.05)"
card = "rgba(76, 79, 105, 0.04)"
well = "#ccd0da"                         # surface0
sunk = "#ffffff"
rule = "#bcc0cc"                         # surface1
idle = "#9ca0b0"                         # overlay0
handle = "#1e66f5"                       # blue
urgent = "#d20f39"                       # red
recording = "#d20f39"
lock = "#dce0e8"
ground = "#dce0e8"
