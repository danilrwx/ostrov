# ostrov's login screen (ostrov greet) under cage on vt 7, remembering the last user and session in
# /var/cache/ostrov-greet (owned by _greetd); ostrov copied to /usr/local/bin, _greetd not let into the users' homes
[terminal]
vt = 7

[default_session]
command = "cage -s -- /usr/local/bin/ostrov greet"
user = "_greetd"
