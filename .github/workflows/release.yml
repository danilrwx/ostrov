name: Release

# A tag vX.Y.Z: ostrov and its official plugins built once on Fedora 43 (the oldest glibc of the systems with
# gtk4-layer-shell 1.2+: Ubuntu 26.04, Debian sid, Fedora 43, Arch), packed by nFPM (nfpm.yaml) as .deb, .rpm and
# Arch's .pkg.tar.zst, then a GitHub release with them and the changelog's section for that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NFPM: v2.47.0

jobs:
  packages:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Dependencies
        run: |
          dnf install -y gcc git pkgconf-pkg-config gtk4-devel gtk4-layer-shell-devel pam-devel wayland-devel curl tar
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/$NFPM/nfpm_${NFPM#v}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm
      - uses: actions/checkout@v4
      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked --workspace
      - name: Pack
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for f in deb rpm archlinux; do nfpm package -f nfpm.yaml -p "$f" -t dist/; done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      # the changelog's section for this version, its heading left out
      - name: Notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{on = ($2 == v)} on && !/^## /' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
