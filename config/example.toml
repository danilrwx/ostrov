# ostrov's config: ~/.config/ostrov/config.toml. Every key here is at its default and may be left out; an empty
# file (or none) is all defaults. A file that does not parse is reported on ostrov's stderr and the defaults taken.
# The control centre's Settings page (the gear beside Edit) edits this file in place, keeping comments and order.
# [colors] and [appearance] are applied as the file is saved; the rest is read when ostrov starts (`ostrov restart`).

# The bar's blocks, left to right in each part. The blocks:
#   workspaces      the workspaces' dots
#   window          the focused window's title
#   privacy         the mic or the camera in use
#   layout          the keyboard's layout
#   tray            the system tray (StatusNotifierItem)
#   panel.ID        a panel's face in the bar, made of its widgets' badges, unrolling the panel on a click:
#                   panel.control (the control centre, alias "status"), panel.calendar (alias "clock"), or one of
#                   [panels.ID] below
#   widget.ID       any widget on its own (ostrov's, a KDL file's, a plugin's): its badge, its menu on a click
[bar]
left = ["workspaces", "window"]
center = ["panel.calendar"]
right = ["privacy", "layout", "tray", "panel.control"]
# the monitors with a bar: "all", "primary" (the one Hyprland has focused as ostrov starts, else the first), or the
# ones named, ["eDP-1", "DP-2"], the first named the launcher's. A command (ostrov panel...) opens on the focused one's.
monitors = "all"

# Idle, as the compositor reports it (ext-idle-notify; inhibitors such as a playing video are honoured). The screen
# is also locked before the machine sleeps and on `loginctl lock-session`. Seconds; 0 never. The Settings page
# also takes durations such as "10m".
[idle]
lock = 600
screens_off = 900

# The look. Applied as the file is saved; the Appearance page (the palette beside Edit) edits it.
[lock]
background = "black"    # the lock screen's ground: black, or blur (the screen as it was, blurred and darkened)

[appearance]
theme = "dark"          # dark, light, graphite, nord, solarized, or an installed one (`ostrov theme list`)
accent = ""             # a colour (#5e81ac, rgb(94, 129, 172), a name); "" the theme's own
surface = ""            # the colour under everything that opens; "" the theme's own
opacity = 0.75          # the surface's, 0.3 to 1
bar_color = ""          # the bar's colour; "" the theme's own
# bar_opacity = 0.65    # 0 clear to 1 solid; unset: 0.65 over a wallpaper, solid over none
# radius = 10           # a surface's corners in px, 0 to 20, what is on it 4 less; unset: the theme's, or 10
# density = "normal"    # compact, normal, comfortable: the control centre's rows; unset: the theme's, or normal
# sliders = "thin"      # thin (a line with a round knob) or bar (thick, filled)
# tab = "auto"          # under a hovered block and a tab: wallpaper, bar; auto: the wallpaper with blur, else the bar
animations = true
# Hyprland's blur behind the bar and what opens: set only when given here or by the theme, Hyprland's own otherwise.
# blur = true
# blur_size = 8         # 1 to 20
# blur_passes = 1       # 1 to 4
# blur_xray = true      # the wallpaper alone under the bar's blur, not the windows (ostrov's layer rule)
# blur_vibrancy = 0.17  # 0 to 1: the colours under it, stronger
# blur_contrast = 0.89  # 0 to 2
# blur_brightness = 0.82 # 0 to 2
# blur_noise = 0.01     # 0 to 0.2: grain
font = ""               # a family (Inter, Iosevka...); "" GTK's own
font_size = 10.0        # points; every text sized from it
icon_size = 16          # px, on what opens
bar_icon_size = 14      # px, in the bar
bar_padding = 10        # px at a bar block's sides
bar_spacing = 7         # px between a block's icons
bar_height = 25         # px

# Any of the palette's colours over the theme's (the names in src/style.rs): fg, dim, ink, accent, accent-rule,
# accent-pressed, bar, surface, hover, raised, card, well, sunk, rule, idle, handle, urgent, recording, lock,
# ground, shade.
[colors]
# urgent = "#cd0000"

# The session's polkit agent: ostrov's password dialog for pkexec and the like. Another agent started first
# (lxpolkit's autostart, hyprpolkitagent) answers instead, in its own look; false leaves it to that one.
[polkit]
agent = true

# What ostrov puts into Hyprland itself over its IPC, at start and after every config reload: its layers' rules
# (blur behind its surfaces) and its keys, each only where the combination is free (a bind of yours is never
# replaced). `ostrov hyprland` prints all of it as hyprland.conf lines, for keeping it there instead.
[hyprland]
rules = true
binds = true

# A key moved: its name, then the combination as Hyprland writes it. The names and their defaults:
#   run SUPER+D, panel SUPER+X, calendar SUPER+C,
#   clip SUPER SHIFT+V, screenshot SUPER SHIFT+S,
#   print Print, lock SUPER SHIFT+X, bar SUPER+B, vol-up, vol-down, vol-mute, mic,
#   bright-up, bright-down, play-pause, next, previous (the XF86 media keys)
[hyprland.keys]
# run = "SUPER, R"


# The launcher's web search, `s words` in it: the engine's URL, {} the words escaped.
[launcher]
search = "https://duckduckgo.com/?q={}"
# more engines by prefix, what follows it in the URL's {}: `g words` to Google, `?question` to Claude
# engines = { "g " = "https://www.google.com/search?q={}", "?" = "https://claude.ai/new?q={}" }

# When toasts keep back (the history kept; a critical one always shows): a game focused, quiet hours, the apps let
# through all the same.
[notifications]
quiet_in_games = true
games = []               # window classes, a trailing * a prefix: ["dota2", "cs2", "steam_app_*"]
quiet_from = ""          # a time of day, 23:00; "" never
quiet_to = ""            # 08:00
allow = []               # ["Telegram Desktop"]

# Panels of your own, put in the bar as panel.ID; the built-in ones (control, calendar) take the same keys to be
# renamed or resized. Their widgets are laid out with Edit and kept in ~/.config/ostrov/panel.toml.
# [panels.music]
# name = "Music"
# icon = "audio-x-generic-symbolic"
# cols = 6                    # its grid's width in cells (Edit's Width): the control centre 6, the calendar 8
# width = 390                 # px, whatever its cells; unset, its cells' width

# Widgets' own settings, [widget.ID], as each widget's schema says (the inspector in Edit, or the Settings page).
[widget.clock]
format = "%a %b %-d  %H:%M"     # strftime's, the time in the bar

[widget.wallpaper]
dir = "~/Pictures/wallpapers"   # the JPEG, PNG and WebP pictures the wallpaper's menu lists
bar = 0.65                      # how solid the bar's black is over a picture: 1 solid, 0 clear
on_change = ""                  # a command run after every pick, the picture in $OSTROV_WALLPAPER

# A KDL widget's settings are [widget.ID] too (docs/widgets.md); a plugin's are [plugin.ID] (docs/plugins.md).
# [plugin.hello-python]
# greeting = "Hi"
